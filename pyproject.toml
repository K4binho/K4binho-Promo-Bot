[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4promo"
version = "1.2.0"
description = "Bot de curadoria de ofertas para Telegram (K4binho Promo Bot)"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "playwright==1.52.0",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
k4promo = "k4promo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Permite rodar a suíte sem instalar o pacote (`python -m pytest -q`).
pythonpath = ["src"]
testpaths = ["tests"]
