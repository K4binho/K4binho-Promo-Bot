name: Promotion Engine V1.1

on:
  push:
    branches: [fix/promotion-engine-v1-1]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/promotion-engine-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V1.1 patch
        run: python scripts/apply_v11.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m py_compile bot.py config.py deal_store.py ml_playwright.py promotion_engine.py
      - name: Tests
        run: python -m pytest -q
      - name: Commit applied changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py deal_store.py ml_playwright.py promotion_engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply Promotion Engine V1.1'
          git pull --rebase origin fix/promotion-engine-v1-1
          git push origin HEAD:fix/promotion-engine-v1-1
